<div class="wrapper">
  <h1>Post your blog here</h1>
  
  <form class="form__contact" action="">
    <fieldset>
      <h3 style="font-weight: bold; font-size: larger;">Hey, Stranger!</h3><br>
      <h3 style="font-weight: bold; font-size: larger;">Your blog topic <span class="form__field field--name" data-placeholder="Blog Topic" tabindex="1" contenteditable></span> please provide sort description on your topic <span class="form__field field--message" data-placeholder="sort description" tabindex="2" contenteditable></span>.</h3><br>
      <h3 style="font-weight: bold; font-size: larger;">Brief Description <span class="form__field field--email" data-placeholder="Brief Description" tabindex="3" contenteditable></span>.</h3>
      <h3 style="font-weight: bold; font-size: larger;">Add your image url <span class="form__field field--email" data-placeholder="image url" tabindex="3" contenteditable></span></h3><br>
      <button style="font-weight: bold; font-size: larger;" type="submit" class="button button--xlarge" tabindex="4">Post Blog &#187;</button>
    </fieldset>
  </form>
</div>
